# Modified for the PhysFlowNet research release on 2026-11-26.

nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:

  - [-1, 1, nn.Identity, []]

  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, PMD, [256]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, PMD, [512]]

  - [[-1, 0], 2, PPRB, [512, True]]

  - [-1, 1, PMD, [1024]]

  - [[-1, 0], 2, PPRB, [1024, True]]

  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[17, 0], 1, PhysFlowNetNeckRefinement, []]
  - [[20, 0], 1, PhysFlowNetNeckRefinement, []]
  - [[23, 0], 1, PhysFlowNetNeckRefinement, []]

  - [[24, 25, 26], 1, PhysFlowNetDetect, [nc]]
